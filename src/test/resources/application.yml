# Test config. It replaces src/main/resources/application.yml for tests (Boot loads the
# first classpath:/application.yml, and test-classes comes first), so nothing from the
# main file applies here unless it is repeated below.
#
# Left out on purpose: the server port. Kafka and springdoc are below only so that
# full-context tests (RateLimitAcceptanceTest) start without a broker.

logging:
  level:
    root: INFO
    ExceptionLogger: ERROR

spring:
  datasource:
    url: jdbc:h2:mem:mydb
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

# Needed by full-context tests (RateLimitAcceptanceTest), which see none of the main
# file. No broker is needed: publishing is off, the default listeners do not start, and
# the admin client does not create topics.
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    admin:
      auto-create: false

kafka-topics:
  prod:
    enabled: false
    orders-topic: order-events-topic

springdoc:
  api-docs:
    path: /openapi
  swagger-ui:
    path: /swagger-ui.html

# Rate-limit values every test context sees. T04 tests rely on these exact numbers,
# so changing one means updating prime-shared.md "Test values" and those tests.
app:
  rate-limit:
    enabled: true
    max-tracked-keys: 1000
    sweep-interval: 1m
    groups:
      general: { capacity: 3, refill-tokens: 1, refill-period: 1s }
      orders:  { capacity: 2, refill-tokens: 1, refill-period: 10s }
